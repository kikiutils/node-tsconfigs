name: Test

on:
  push:
    tags:
      - v*
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24.15.0
          - '26'
        os:
          - ubuntu-latest
          - windows-latest
        include:
          - typecheck: true
            node: 24.15.0
            os: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          require-lockfile: true
          runtime: node@${{ matrix.node }}
          version: latest

      - name: Run typecheck
        if: ${{ matrix.typecheck }}
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test
